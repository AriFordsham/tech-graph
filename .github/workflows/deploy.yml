name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Preserve the built output before switching branches
          mkdir -p /tmp/tech-graph-dist
          cp -r dist/. /tmp/tech-graph-dist/
          # Switch to / create the gh-pages branch
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . --cached
          fi
          # Replace branch content with the fresh build (keep .git)
          find . -maxdepth 1 -not -name . -not -name .git -exec rm -rf {} +
          cp -r /tmp/tech-graph-dist/. .
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Deploy to GitHub Pages: ${{ github.sha }}"
            git push origin gh-pages
          else
            echo "No changes to deploy"
          fi
